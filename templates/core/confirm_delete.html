{% extends "base.html" %}
{% block title %}Eliminar{% endblock %}
{% block content %}
<div class="max-w-lg glass rounded-2xl p-8">
  <h1 class="font-display text-xl font-bold text-white">¿Eliminar «{{ object }}»?</h1>
  <p class="text-sm text-slate-400 mt-2">Esta acción no se puede deshacer.</p>
  <form method="post" class="flex gap-3 mt-6">{% csrf_token %}
    <button class="rounded-xl bg-rose-600 hover:bg-rose-500 px-6 py-2.5 font-semibold text-white">Sí, eliminar</button>
    <a href="{{ volver }}" class="rounded-xl glass px-6 py-2.5">Cancelar</a>
  </form>
</div>
{% endblock %}
